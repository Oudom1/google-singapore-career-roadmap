<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning track · CareerLaunch Singapore</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ff;background:#0a1224;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#183b60,transparent 45%),#0a1224;min-height:100vh}header{position:sticky;top:0;z-index:5;background:#0c1730ed;border-bottom:1px solid #324260;padding:16px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#9bd9ff}header a{text-decoration:none;font-weight:750}main{max-width:1100px;margin:auto;padding:36px 20px 95px}.eyebrow{color:#8dcfff;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:clamp(34px,5vw,54px);line-height:1.1;margin:13px 0}h2{font-size:23px}p{color:#aebed6;line-height:1.65}.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.stat{padding:20px;background:#172c48;border:1px solid #3e6188;border-radius:16px;text-align:center;font-weight:800;font-size:24px}.stat small{display:block;font-size:12px;font-weight:500;color:#acc9e5}.toolbar{display:flex;gap:10px;margin:28px 0}.toolbar input{flex:1;background:#101f36;color:white;border:1px solid #405b7c;border-radius:11px;padding:13px;font:inherit}.group{background:#12233d;border:1px solid #354b6a;border-radius:17px;padding:22px;margin-bottom:17px}.group h2{margin:0 0 7px}.topic{display:flex;align-items:center;gap:13px;border-top:1px solid #ffffff19;padding:12px 0}.topic input{width:18px;height:18px;accent-color:#49baff}.topic button{background:none;border:0;color:#e5f2ff;font:inherit;text-align:left;cursor:pointer;padding:7px;flex:1}.topic button:hover{text-decoration:underline}.badge{color:#8bcbf4;font-size:12px}.dialog{background:#101f36;color:#eaf3ff;border:1px solid #5079a3;border-radius:18px;max-width:670px;width:calc(100vw - 26px);padding:25px;box-shadow:0 25px 80px #0009}.dialog::backdrop{background:#020915ce}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.button{background:#327ce8;color:white;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.button.alt{background:#243d5c}.resource{display:block;border:1px solid #345574;background:#142c4a;padding:13px;border-radius:10px;margin:10px 0;text-decoration:none}.resource:hover{background:#22517a}.challenge{background:#162e4a;border-radius:12px;padding:15px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #6ee3ff;outline-offset:3px}@media(max-width:630px){.top{grid-template-columns:1fr}.stat{text-align:left}.toolbar{flex-direction:column}.group{padding:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body><header><a href="./index.html#skills-library">← All learning modules</a><a href="./index.html#roadmap">12-month roadmap</a></header><main><div class="top"><div><div class="eyebrow">CareerLaunch · Google Singapore</div><h1 id="heading">Learning track</h1><p id="description">Choose a topic, review the references, and build a practical demonstration.</p></div><div class="stat"><span id="counter">0 / 0</span><small>Topics completed</small></div></div><div class="toolbar"><input type="search" id="search" placeholder="Search lessons in this module…" aria-label="Search lessons"></div><div id="content"></div></main><dialog id="lesson" class="dialog" aria-labelledby="lessonTitle"><div class="eyebrow" id="lessonCategory"></div><h2 id="lessonTitle"></h2><p id="lessonExplanation"></p><div id="resources"></div><div class="challenge"><strong>Practical assignment</strong><p id="challengeText"></p></div><div class="actions"><button class="button" id="mark">Mark complete</button><button class="button alt" id="close">Back to lessons</button></div></dialog><script>
const tracks=[
{name:"Linux & Systems",desc:"Troubleshooting production systems",docs:"https://www.kernel.org/doc/html/latest/",lab:"https://linuxjourney.com/",topics:["Shell commands and file permissions","Processes, services and systemd","SSH, logs and journalctl","Disk, memory and CPU troubleshooting","Package management and Bash scripting","Linux server hardening"]},
{name:"Networking",desc:"Foundations for support and SRE interviews",docs:"https://cloud.google.com/architecture/framework/networking",lab:"https://cloud.google.com/vpc/docs",topics:["TCP/IP, ports and OSI","DNS and HTTP/HTTPS troubleshooting","Subnets, routing and NAT","Firewalls, VPN and load balancing","Packet capture and network diagnostics","Designing secure cloud networks"]},
{name:"Google Cloud Platform",desc:"Cloud engineering and customer support",docs:"https://cloud.google.com/docs",lab:"https://www.cloudskillsboost.google/",topics:["Projects, billing and quotas","Compute Engine and virtual machines","Cloud Run and application deployment","Cloud Storage and databases","Cloud IAM and service accounts","Cloud Logging, Monitoring and alerts","VPC firewall and connectivity","Cloud architecture and cost control"]},
{name:"Terraform & Automation",desc:"Infrastructure as code and repeatability",docs:"https://developer.hashicorp.com/terraform/tutorials",lab:"https://developer.hashicorp.com/terraform/tutorials",topics:["Terraform providers and state","Variables, outputs and modules","Provision a small GCP environment","GitHub Actions CI/CD","Shell and Python cloud automation","Secrets handling and safe rollbacks"]},
{name:"Containers & Kubernetes",desc:"Application runtime and platform skills",docs:"https://kubernetes.io/docs/tutorials/",lab:"https://docs.docker.com/get-started/",topics:["Docker images and Dockerfiles","Containers, ports and volumes","Docker Compose local stack","Kubernetes Pods and Deployments","Services, ingress and ConfigMaps","Debug container logs and restarts"]},
{name:"Cloud Security & IAM",desc:"Use your enterprise identity experience",docs:"https://cloud.google.com/security",lab:"https://cloud.google.com/iam/docs",topics:["Principle of least privilege","IAM roles and policy conditions","Workload identity and keyless access","Security Command Center basics","Audit logs and incident response","Threat modeling and cloud hardening"]},
{name:"SRE & Observability",desc:"Reliability, incidents and troubleshooting",docs:"https://sre.google/sre-book/table-of-contents/",lab:"https://cloud.google.com/monitoring/docs",topics:["SLIs, SLOs and error budgets","Metrics, logs and distributed tracing","Incident management and postmortems","Capacity planning and reliability","On-call runbooks and alert tuning","Performance debugging and load testing"]},
{name:"SQL & APIs",desc:"Data queries and service integration",docs:"https://www.postgresql.org/docs/current/tutorial.html",lab:"https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps",topics:["SQL SELECT, JOIN and aggregation","Indexes and query troubleshooting","REST APIs, JSON and HTTP codes","API authentication and authorization","Build and test a small API","Database backups and migrations"]},
{name:"JavaScript, TypeScript & Git",desc:"Practical software delivery for portfolios",docs:"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide",lab:"https://www.typescriptlang.org/docs/handbook/intro.html",topics:["Modern JavaScript essentials","TypeScript types and interfaces","React components and state","Git branches, pull requests and reviews","Automated tests and debugging","Build and deploy a small web app"]},
{name:"Google Interview Preparation",desc:"Turn practical skills into job readiness",docs:"https://www.google.com/about/careers/applications/how-we-hire/",lab:"https://developers.google.com/edu/python",topics:["Technical troubleshooting interviews","Explain a system design clearly","Coding and scripting practice","Behavioral STAR examples","Portfolio walkthrough and tradeoffs","Resume and application review"]}
];
const pyGroups=[
{category:"Getting started",topics:["Installing Python and VS Code","Using the Python REPL and scripts","Variables and assignment","Numbers and arithmetic","Strings and formatting","Booleans and comparisons","Input, output and comments","Type conversion and type hints"]},
{category:"Control flow and collections",topics:["if, elif and else","for and while loops","range, break and continue","Lists and slicing","Tuples and unpacking","Sets and set operations","Dictionaries and mapping","List, set and dict comprehensions"]},
{category:"Functions and code organization",topics:["Defining functions and return values","Arguments, keyword arguments and defaults","Scope and closures","Lambda, map and filter","Modules, packages and imports","Virtual environments and pip","Exceptions and error handling","Docstrings, typing and linting"]},
{category:"Files, automation and integration",topics:["Reading and writing text files","CSV processing","JSON processing","Pathlib and file management","Regular expressions","Logging and diagnostics","Datetime and scheduling","Command line interfaces with argparse","HTTP APIs with requests","REST API authentication and pagination","Subprocess and system automation","Environment variables and secrets"]},
{category:"Object-oriented and advanced Python",topics:["Classes, objects and methods","Inheritance and composition","Dataclasses and properties","Iterators and generators","Decorators and context managers","Asyncio and async functions","Threading and multiprocessing","Performance profiling and optimization"]},
{category:"Testing and software quality",topics:["Assertions and debugging","Unit testing with unittest","Pytest tests and fixtures","Mocking external services","Static typing with mypy","Code formatting and linting","Packaging and pyproject.toml","GitHub Actions CI for Python"]},
{category:"Data, databases and web",topics:["SQL and SQLite","SQLAlchemy ORM basics","Pandas dataframes","NumPy arrays","Matplotlib charts","Data cleaning and CSV reporting","Flask or FastAPI endpoints","Input validation with Pydantic"]},
{category:"Cloud, security and career projects",topics:["Google Cloud Python client libraries","Google Cloud Storage automation","Google Cloud Logging API","IAM automation and least privilege","Secure credentials and secret management","Security log analysis project","Cloud incident troubleshooting project","Python technical interview exercises"]}
];
const params=new URLSearchParams(location.search),index=Number(params.get('track')),python=params.get('track')==='python';
const track=python?{name:'Python',desc:'From scripting to cloud automation',groups:pyGroups,docs:'https://docs.python.org/3/tutorial/',lab:'https://developers.google.com/edu/python/'}:tracks[index];
if(!track){document.getElementById('heading').textContent='Module not found';document.getElementById('description').textContent='Choose a module from the course directory.';document.getElementById('search').disabled=true;}
else {
 const KEY=python?'google_sg_python_catalog_v1':'google_sg_skill_library_v1';
 let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
 document.title=track.name+' · CareerLaunch Singapore';
 document.getElementById('heading').textContent=track.name;
 document.getElementById('description').textContent=track.desc+'. Open each lesson for documentation, video tutorials and hands-on practice.';
 const groups=python?track.groups:[{category:track.name,topics:track.topics}];
 const idOf=(g,j)=>python?g+'-'+j:index+'-'+j;
 const content=document.getElementById('content'),dialog=document.getElementById('lesson');
 let active=null;
 function draw(){
   const q=document.getElementById('search').value.trim().toLowerCase();
   content.replaceChildren();
   groups.forEach((group,g)=>{
     const topics=group.topics.map((topic,j)=>({topic,j})).filter(x=>x.topic.toLowerCase().includes(q));
     if(!topics.length)return;
     const box=document.createElement('section');box.className='group';const h=document.createElement('h2');h.textContent=group.category;box.appendChild(h);
     const small=document.createElement('p');small.className='badge';small.textContent=topics.length+' topics';box.appendChild(small);
     topics.forEach(({topic,j})=>{
       const id=idOf(g,j),row=document.createElement('div');row.className='topic';
       const check=document.createElement('input');check.type='checkbox';check.checked=!!saved[id];check.setAttribute('aria-label','Complete '+topic);check.onchange=()=>{saved[id]=check.checked;localStorage.setItem(KEY,JSON.stringify(saved));count()};
       const button=document.createElement('button');button.type='button';button.textContent=topic+' ↗';button.onclick=()=>open(g,j);
       row.append(check,button);box.appendChild(row);
     });content.appendChild(box);
   });if(!content.children.length){const p=document.createElement('p');p.textContent='No lessons match this search.';content.appendChild(p);}count();
 }
 function count(){const total=groups.reduce((n,g)=>n+g.topics.length,0);let n=0;groups.forEach((group,g)=>group.topics.forEach((_,j)=>{if(saved[idOf(g,j)])n++}));document.getElementById('counter').textContent=n+' / '+total}
 function open(g,j){
   const topic=groups[g].topics[j];active=idOf(g,j);
   document.getElementById('lessonCategory').textContent=groups[g].category;
   document.getElementById('lessonTitle').textContent=topic;
   document.getElementById('lessonExplanation').textContent='Learn '+topic.toLowerCase()+', then demonstrate the skill using a small, reproducible project.';
   document.getElementById('challengeText').textContent='Create a working example of '+topic.toLowerCase()+'. Document how to set it up, test a normal case, troubleshoot a failure, and explain the result in a README using sample data.';
   const links=[['Official documentation',python?'https://docs.python.org/3/tutorial/':track.docs],['Hands-on tutorials',python?'https://developers.google.com/edu/python/':track.lab],['YouTube lessons','https://www.youtube.com/results?search_query='+encodeURIComponent(track.name+' '+topic+' tutorial')]];
   const root=document.getElementById('resources');root.replaceChildren();links.forEach(([label,url])=>{const a=document.createElement('a');a.className='resource';a.textContent=label+' ↗';a.href=url;a.target='_blank';a.rel='noopener noreferrer';root.appendChild(a)});
   document.getElementById('mark').textContent=saved[active]?'Mark incomplete':'Mark complete';dialog.showModal();
 }
 document.getElementById('mark').onclick=()=>{if(!active)return;saved[active]=!saved[active];localStorage.setItem(KEY,JSON.stringify(saved));dialog.close();draw()};
 document.getElementById('close').onclick=()=>dialog.close();document.getElementById('search').oninput=draw;draw();
}
</script></body></html>
